name: Update Trayector Profile Kit

on:
  workflow_dispatch:
    inputs:
      trayector_ref:
        description: "Trayector ref to update from"
        required: false
        default: "main"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: trayector-profile-kit-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Prepare Trayector snapshots
        id: upstream
        env:
          TRAYECTOR_REF: ${{ inputs.trayector_ref }}
        shell: bash
        run: |
          set -euo pipefail

          repo=".trayector-repo"
          base_dir=".trayector-update/base"
          new_dir=".trayector-update/new"

          rm -rf "$repo" .trayector-update
          mkdir -p "$base_dir" "$new_dir"

          git clone --filter=blob:none --no-checkout https://github.com/demonccc/trayector.git "$repo"
          git -C "$repo" fetch --depth=1 origin "$TRAYECTOR_REF"
          new_sha="$(git -C "$repo" rev-parse FETCH_HEAD)"

          base_sha=""
          if [ -f .trayector/UPSTREAM ]; then
            base_sha="$(tr -d '[:space:]' < .trayector/UPSTREAM)"
          fi

          if [ -n "$base_sha" ]; then
            if ! git -C "$repo" cat-file -e "${base_sha}^{commit}" 2>/dev/null; then
              git -C "$repo" fetch origin "$base_sha"
            fi
            git -C "$repo" archive "$base_sha" profile-kit | tar -x -C "$base_dir"
          fi

          git -C "$repo" archive "$new_sha" profile-kit | tar -x -C "$new_dir"

          echo "base_sha=$base_sha" >> "$GITHUB_OUTPUT"
          echo "new_sha=$new_sha" >> "$GITHUB_OUTPUT"

      - name: Three-way update Profile Kit
        id: merge
        env:
          BASE_SHA: ${{ steps.upstream.outputs.base_sha }}
          NEW_SHA: ${{ steps.upstream.outputs.new_sha }}
        shell: bash
        run: |
          set -euo pipefail

          local_dir=".trayector"
          base_dir=".trayector-update/base/profile-kit"
          new_dir=".trayector-update/new/profile-kit"
          review_dir="$local_dir/.update"
          incoming_dir="$review_dir/incoming"
          report="$review_dir/README.md"

          mkdir -p "$local_dir"
          rm -rf "$review_dir"
          mkdir -p "$incoming_dir"

          conflicts=0
          : > /tmp/trayector-conflicts

          if [ -z "$BASE_SHA" ]; then
            echo "No .trayector/UPSTREAM baseline was found." >> /tmp/trayector-conflicts
            echo "The updater will not overwrite existing local files without a known base." >> /tmp/trayector-conflicts
            conflicts=1
          fi

          mapfile -t paths < <(
            {
              if [ -d "$base_dir" ]; then find "$base_dir" -type f -printf '%P\n'; fi
              if [ -d "$new_dir" ]; then find "$new_dir" -type f -printf '%P\n'; fi
            } | sort -u
          )

          for path in "${paths[@]}"; do
            base="$base_dir/$path"
            remote="$new_dir/$path"
            local="$local_dir/$path"

            b=0; r=0; l=0
            [ -f "$base" ] && b=1
            [ -f "$remote" ] && r=1
            [ -f "$local" ] && l=1

            mkdir -p "$(dirname "$local")"

            if [ -z "$BASE_SHA" ]; then
              if [ "$r" -eq 1 ] && [ "$l" -eq 0 ]; then
                cp "$remote" "$local"
              elif [ "$r" -eq 1 ] && [ "$l" -eq 1 ] && ! cmp -s "$local" "$remote"; then
                mkdir -p "$incoming_dir/$(dirname "$path")"
                cp "$remote" "$incoming_dir/$path"
                printf '%s\n' "- \`$path\`: local file exists and no upstream baseline is known." >> /tmp/trayector-conflicts
              fi
              continue
            fi

            if [ "$b" -eq 0 ] && [ "$r" -eq 1 ]; then
              if [ "$l" -eq 0 ]; then
                cp "$remote" "$local"
              elif ! cmp -s "$local" "$remote"; then
                conflicts=1
                mkdir -p "$incoming_dir/$(dirname "$path")"
                cp "$remote" "$incoming_dir/$path"
                printf '%s\n' "- \`$path\`: added upstream but a custom local file already uses that path." >> /tmp/trayector-conflicts
              fi
              continue
            fi

            if [ "$b" -eq 1 ] && [ "$r" -eq 0 ]; then
              if [ "$l" -eq 0 ]; then
                :
              elif cmp -s "$local" "$base"; then
                rm -f "$local"
              else
                conflicts=1
                printf '%s\n' "- \`$path\`: removed upstream but modified locally; local file was preserved." >> /tmp/trayector-conflicts
              fi
              continue
            fi

            if [ "$b" -eq 1 ] && [ "$r" -eq 1 ]; then
              if [ "$l" -eq 0 ]; then
                if ! cmp -s "$base" "$remote"; then
                  conflicts=1
                  mkdir -p "$incoming_dir/$(dirname "$path")"
                  cp "$remote" "$incoming_dir/$path"
                  printf '%s\n' "- \`$path\`: deleted locally but changed upstream; local deletion was preserved for review." >> /tmp/trayector-conflicts
                fi
                continue
              fi

              if cmp -s "$local" "$remote"; then
                continue
              fi

              if cmp -s "$local" "$base"; then
                cp "$remote" "$local"
                continue
              fi

              if cmp -s "$remote" "$base"; then
                continue
              fi

              merged="$(mktemp)"
              set +e
              git merge-file -p "$local" "$base" "$remote" > "$merged"
              rc=$?
              set -e

              if [ "$rc" -eq 0 ]; then
                mv "$merged" "$local"
              else
                conflicts=1
                mkdir -p "$incoming_dir/$(dirname "$path")"
                mv "$merged" "$incoming_dir/$path"
                printf '%s\n' "- \`$path\`: both local and upstream changed and could not be merged automatically." >> /tmp/trayector-conflicts
              fi
            fi
          done

          if [ "$conflicts" -eq 0 ]; then
            printf '%s\n' "$NEW_SHA" > "$local_dir/UPSTREAM"
            rm -rf "$review_dir"
            echo "conflicts=false" >> "$GITHUB_OUTPUT"
          else
            cat > "$report" <<EOF
          # Trayector update requires review

          The Profile Kit contains local customizations that could not be safely reconciled automatically.

          - Previous upstream: ${BASE_SHA:-unknown}
          - Proposed upstream: $NEW_SHA

          Local files were preserved. Incoming or auto-merged conflict candidates are under \`.trayector/.update/incoming/\`.

          Resolve each item manually in the actual \`.trayector/\` file. When the update is fully resolved:

          1. remove \`.trayector/.update/\`;
          2. set \`.trayector/UPSTREAM\` to \`$NEW_SHA\`;
          3. commit those resolutions to this PR branch.

          ## Conflicts

          EOF
            cat /tmp/trayector-conflicts >> "$report"
            echo "conflicts=true" >> "$GITHUB_OUTPUT"
          fi

          rm -rf .trayector-repo .trayector-update

      - name: Check for changes
        id: diff
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- .trayector)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open or update Trayector update PR
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          HAS_CONFLICTS: ${{ steps.merge.outputs.conflicts }}
          NEW_SHA: ${{ steps.upstream.outputs.new_sha }}
        shell: bash
        run: |
          set -euo pipefail

          branch="trayector/update-profile-kit"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git checkout -B "$branch"
          git add .trayector
          git commit -m "chore: propose Trayector profile kit update"

          git fetch origin "$branch" 2>/dev/null || true
          git push --force-with-lease origin "$branch"

          if [ "$HAS_CONFLICTS" = "true" ]; then
            body="Trayector Profile Kit update to \`$NEW_SHA\` requires manual conflict resolution. Local customizations were preserved. Review \`.trayector/.update/README.md\`, resolve the affected files in \`.trayector/\`, remove \`.trayector/.update/\`, and update \`.trayector/UPSTREAM\` before merging."
          else
            body="Proposes a three-way update of the local Trayector Profile Kit to \`$NEW_SHA\`. Local customizations that do not conflict with upstream changes are preserved. Review the diff before merging."
          fi

          existing="$(gh pr list --head "$branch" --state open --json number --jq '.[0].number // empty')"

          if [ -z "$existing" ]; then
            gh pr create \
              --base "${{ github.event.repository.default_branch }}" \
              --head "$branch" \
              --title "Update Trayector profile instructions" \
              --body "$body"
          else
            gh pr edit "$existing" --body "$body"
          fi
