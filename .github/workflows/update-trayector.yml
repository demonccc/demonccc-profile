name: Update Trayector Profile Kit

on:
  workflow_dispatch:
    inputs:
      trayector_version:
        description: "Trayector version to update to (for example 0.2.0)"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: trayector-profile-kit-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Prepare Trayector snapshots
        id: upstream
        env:
          NEW_VERSION: ${{ inputs.trayector_version }}
        shell: bash
        run: |
          set -euo pipefail

          repo=".trayector-repo"
          base_dir=".trayector-update/base"
          new_dir=".trayector-update/new"
          new_tag="v${NEW_VERSION}"

          rm -rf "$repo" .trayector-update
          mkdir -p "$base_dir" "$new_dir"

          git clone --filter=blob:none --no-checkout https://github.com/demonccc/trayector.git "$repo"

          if ! git -C "$repo" fetch --depth=1 origin "refs/tags/$new_tag:refs/tags/$new_tag"; then
            echo "Trayector release tag '$new_tag' was not found." >&2
            exit 1
          fi

          base_version=""
          if [ -f .trayector/VERSION ]; then
            base_version="$(tr -d '[:space:]' < .trayector/VERSION)"
          fi

          if [ -n "$base_version" ]; then
            base_tag="v${base_version}"
            if ! git -C "$repo" fetch --depth=1 origin "refs/tags/$base_tag:refs/tags/$base_tag"; then
              echo "Current Trayector baseline tag '$base_tag' was not found upstream." >&2
              exit 1
            fi
            git -C "$repo" archive "$base_tag" profile-kit | tar -x -C "$base_dir"
          fi

          git -C "$repo" archive "$new_tag" profile-kit | tar -x -C "$new_dir"

          kit_version="$(tr -d '[:space:]' < "$new_dir/profile-kit/VERSION")"
          if [ "$kit_version" != "$NEW_VERSION" ]; then
            echo "Tag '$new_tag' contains Profile Kit VERSION '$kit_version', expected '$NEW_VERSION'." >&2
            exit 1
          fi

          echo "base_version=$base_version" >> "$GITHUB_OUTPUT"
          echo "new_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "new_tag=$new_tag" >> "$GITHUB_OUTPUT"

      - name: Three-way update Profile Kit
        id: merge
        env:
          BASE_VERSION: ${{ steps.upstream.outputs.base_version }}
          NEW_VERSION: ${{ steps.upstream.outputs.new_version }}
          NEW_TAG: ${{ steps.upstream.outputs.new_tag }}
        shell: bash
        run: |
          set -euo pipefail

          local_dir=".trayector"
          base_dir=".trayector-update/base/profile-kit"
          new_dir=".trayector-update/new/profile-kit"
          review_dir="$local_dir/.update"
          incoming_dir="$review_dir/incoming"
          report="$review_dir/README.md"

          mkdir -p "$local_dir"
          rm -rf "$review_dir"
          mkdir -p "$incoming_dir"

          conflicts=0
          : > /tmp/trayector-conflicts

          if [ -z "$BASE_VERSION" ]; then
            printf '%s\n' "No .trayector/VERSION baseline was found." >> /tmp/trayector-conflicts
            printf '%s\n' "Existing local files will not be overwritten without a known release baseline." >> /tmp/trayector-conflicts
            conflicts=1
          fi

          mapfile -t paths < <(
            {
              if [ -d "$base_dir" ]; then find "$base_dir" -type f -printf '%P\n'; fi
              if [ -d "$new_dir" ]; then find "$new_dir" -type f -printf '%P\n'; fi
            } | grep -v '^VERSION$' | sort -u
          )

          for path in "${paths[@]}"; do
            base="$base_dir/$path"
            remote="$new_dir/$path"
            local="$local_dir/$path"

            b=0; r=0; l=0
            [ -f "$base" ] && b=1
            [ -f "$remote" ] && r=1
            [ -f "$local" ] && l=1

            mkdir -p "$(dirname "$local")"

            if [ -z "$BASE_VERSION" ]; then
              if [ "$r" -eq 1 ] && [ "$l" -eq 0 ]; then
                cp "$remote" "$local"
              elif [ "$r" -eq 1 ] && [ "$l" -eq 1 ] && ! cmp -s "$local" "$remote"; then
                mkdir -p "$incoming_dir/$(dirname "$path")"
                cp "$remote" "$incoming_dir/$path"
                printf '%s\n' "- \`$path\`: local file exists and no release baseline is known." >> /tmp/trayector-conflicts
              fi
              continue
            fi

            if [ "$b" -eq 0 ] && [ "$r" -eq 1 ]; then
              if [ "$l" -eq 0 ]; then
                cp "$remote" "$local"
              elif ! cmp -s "$local" "$remote"; then
                conflicts=1
                mkdir -p "$incoming_dir/$(dirname "$path")"
                cp "$remote" "$incoming_dir/$path"
                printf '%s\n' "- \`$path\`: added upstream but a custom local file already uses that path." >> /tmp/trayector-conflicts
              fi
              continue
            fi

            if [ "$b" -eq 1 ] && [ "$r" -eq 0 ]; then
              if [ "$l" -eq 1 ] && cmp -s "$local" "$base"; then
                rm -f "$local"
              elif [ "$l" -eq 1 ]; then
                conflicts=1
                printf '%s\n' "- \`$path\`: removed upstream but modified locally; local file was preserved." >> /tmp/trayector-conflicts
              fi
              continue
            fi

            if [ "$b" -eq 1 ] && [ "$r" -eq 1 ]; then
              if [ "$l" -eq 0 ]; then
                if ! cmp -s "$base" "$remote"; then
                  conflicts=1
                  mkdir -p "$incoming_dir/$(dirname "$path")"
                  cp "$remote" "$incoming_dir/$path"
                  printf '%s\n' "- \`$path\`: deleted locally but changed upstream; local deletion was preserved for review." >> /tmp/trayector-conflicts
                fi
                continue
              fi

              if cmp -s "$local" "$remote"; then continue; fi
              if cmp -s "$local" "$base"; then cp "$remote" "$local"; continue; fi
              if cmp -s "$remote" "$base"; then continue; fi

              merged="$(mktemp)"
              set +e
              git merge-file -p "$local" "$base" "$remote" > "$merged"
              rc=$?
              set -e

              if [ "$rc" -eq 0 ]; then
                mv "$merged" "$local"
              else
                conflicts=1
                mkdir -p "$incoming_dir/$(dirname "$path")"
                mv "$merged" "$incoming_dir/$path"
                printf '%s\n' "- \`$path\`: both local and upstream changed and could not be merged automatically." >> /tmp/trayector-conflicts
              fi
            fi
          done

          if [ "$conflicts" -eq 0 ]; then
            printf '%s\n' "$NEW_VERSION" > "$local_dir/VERSION"
            rm -rf "$review_dir"
            echo "conflicts=false" >> "$GITHUB_OUTPUT"
          else
            cat > "$report" <<EOF
          # Trayector update requires review

          The local Profile Kit contains customizations that could not be safely reconciled automatically.

          - Previous version: ${BASE_VERSION:-unknown}
          - Proposed version: $NEW_VERSION
          - Proposed release tag: $NEW_TAG

          Local files were preserved. Incoming or conflict candidates are under \`.trayector/.update/incoming/\`.

          Resolve each item manually in the actual \`.trayector/\` file. When the update is fully resolved:

          1. remove \`.trayector/.update/\`;
          2. set \`.trayector/VERSION\` to \`$NEW_VERSION\`;
          3. commit those resolutions to this PR branch.

          ## Conflicts

          EOF
            cat /tmp/trayector-conflicts >> "$report"
            echo "conflicts=true" >> "$GITHUB_OUTPUT"
          fi

          rm -rf .trayector-repo .trayector-update

      - name: Check for changes
        id: diff
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- .trayector)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open or update Trayector update PR
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          HAS_CONFLICTS: ${{ steps.merge.outputs.conflicts }}
          NEW_VERSION: ${{ steps.upstream.outputs.new_version }}
          NEW_TAG: ${{ steps.upstream.outputs.new_tag }}
        shell: bash
        run: |
          set -euo pipefail

          branch="trayector/update-profile-kit"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git checkout -B "$branch"
          git add .trayector
          git commit -m "chore: propose Trayector $NEW_VERSION profile kit update"

          git fetch origin "$branch" 2>/dev/null || true
          git push --force-with-lease origin "$branch"

          if [ "$HAS_CONFLICTS" = "true" ]; then
            body="Trayector Profile Kit update to \`$NEW_VERSION\` (\`$NEW_TAG\`) requires manual conflict resolution. Local customizations were preserved. Review \`.trayector/.update/README.md\`, resolve the affected files, remove \`.trayector/.update/\`, and update \`.trayector/VERSION\` before merging."
          else
            body="Proposes a three-way update of the local Trayector Profile Kit to \`$NEW_VERSION\` (\`$NEW_TAG\`). Local customizations that do not conflict with upstream changes are preserved. Review the diff before merging."
          fi

          existing="$(gh pr list --head "$branch" --state open --json number --jq '.[0].number // empty')"

          if [ -z "$existing" ]; then
            gh pr create \
              --base "${{ github.event.repository.default_branch }}" \
              --head "$branch" \
              --title "Update Trayector profile instructions to $NEW_VERSION" \
              --body "$body"
          else
            gh pr edit "$existing" --title "Update Trayector profile instructions to $NEW_VERSION" --body "$body"
          fi
